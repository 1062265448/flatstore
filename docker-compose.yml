version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: flatstore-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: flat_library
    volumes:
      - flatstore_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4

volumes:
  flatstore_mysql_data:
    external: true
